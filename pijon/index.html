<style>

display{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-weight:900;letter-spacing:-3px;text-transform:uppercase;line-height:.91;font-size:clamp(63px,10.5vw,133px);margin:0}.display span{display:block;color:var(--red)}.hero-layout{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:20px}.lead{font-size:clamp(17px,2vw,21px);line-height:1.4;max-width:520px;margin:28px 0 22px;font-weight:700}.info-pills{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.pill{border:1.5px solid var(--ink);padding:8px 10px;border-radius:100px;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.4px;background:var(--paper2)}.hero-art{position:relative;min-height:380px;display:grid;place-items:center}.sun{position:absolute;width:min(100%,390px);aspect-ratio:1;border:2px solid var(--ink);background:var(--lime);border-radius:50%;box-shadow:var(--shade);transform:rotate(-10deg)}.dog{position:relative;width:min(100%,420px);z-index:1;filter:drop-shadow(5px 8px 0 rgba(25,25,20,.2));animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:rotate(-3deg) translateY(-8px)}}.stamp{position:absolute;z-index:3;right:0;top:18px;transform:rotate(14deg);border:3px solid var(--red);color:var(--red);background:var(--paper);border-radius:100px;padding:13px 15px;text-align:center;font-size:13px;font-weight:900;line-height:1.05;text-transform:uppercase;letter-spacing:1px}.btn{border:2px solid var(--ink);background:var(--red);color:var(--ink);padding:16px 23px;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:16px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;box-shadow:var(--shade);transition:transform .12s,box-shadow .12s;text-decoration:none}.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}.btn:active{transform:translate(5px,5px);box-shadow:none}.btn.dark{background:var(--ink);color:var(--paper2)}.btn.cream{background:var(--paper2)}.btn.wide{width:100%}.btn:disabled{opacity:.5;cursor:n e.correct{background:var(--lime)}.choice.wrong{background:#ffc6b6}.choice.dim{opacity:.46}.choice:disabled{cursor:default}.response{margin-top:18px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--lime);padding:17px 19px;animation:appear .22s}.response.nope{background:#fbd3c6}.response h3{font-weight:900;font-size:16px;letter-spacing:.8px;margin:0 0 5px;text-transform:uppercase}.response p{margin:0;line-height:1.5}.quiz-actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:15px;margin-top:23px}.back{border:0;background:transparent;font-size:13px;font-weight:900;text-decoration:underline;text-underline-offset:5px;color:var(--ink);padding:14px 0}.sidebar{border:2px solid var(--ink);background:#e7dfc9;height:max-content;padding:20px;transform:rotate(1deg);box-shadow:var(--shade)}.side-title{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding-bottom:11px;border-bottom:2px solid}.side-big{font-family:Impact,Arial,sans-serif;font-size:83px;letter-spacing:-3px;line-height:1;margin:14px 0}.side-caption{font-size:13px;color:var(--muted);font-weight:700}.side-badge{background:var(--ink);color:var(--paper);font-size:11px;line-height:1.4;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:12px;margin-top:25px}.result{padding-top:22px}.result-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}.result .display{font-size:clamp(55px,9.3vw,110px)}.score-line{font:900 clamp(70px,11vw,130px)/1 Impact,Arial,sans-serif;letter-spacing:-6px;margin:20px 0 6px}.score-line span{color:var(--red);font-size:.5em;letter-spacing:-2px}.rank{font-size:clamp(23px,4vw,37px);font-weight:900;line-height:1.1;letter-spacing:-.8px;margin:18px 0}.rank-info{font-size:18px;line-height:1.55;font-weight:650;max-width:600px}.result-stamp{font-weight:900;text-align:center;background:var(--lime);border:3px solid var(--ink);padding:35px 18px;box-shadow:var(--shade);transform:rotate(3deg)}.result-stamp .medal{font-size:100px;line-height:1.3}.result-stamp p{font-weight:900;letter-spacing:1.7px;font-size:12px;text-transform:uppercase}.result-actions{display:flex;flex-wrap:wrap;gap:15px;margin-top:26px}.breakdown{border-top:2px solid;margin-top:47px;padding-top:20px}.breakdown h3{font-weight:900;letter-spacing:-1px;font-size:27px}.break-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.2);font-size:14px}.break-item .symbol{font-size:20px;width:25px;flex:0 0 25px}.foot{display:flex;justify-content:space-between;gap:22px;border-top:2px solid var(--ink);margin-top:50px;padding-top:18px;font-weight:900;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper2);font-weight:800;font-size:14px;padding:14px 20px;box-shadow:var(--shade);z-index:50;max-width:90vw;text-align:center}.confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:30}.confetti i{position:absolute;width:8px;height:17px;top:-30px;opacity:.95;animation:fall var(--dur) linear forwards;transform:rotate(var(--angle));background:var(--color)}@keyframes fall{to{transform:translate(var(--drift),105vh) rotate(940deg);opacity:0}}@media(max-width:780px){.shell{padding:18px 18px 45px}.hero-layout,.result-hero{grid-template-columns:1fr}.hero-art{grid-row:1;min-height:260px}.hero-art .sun{width:250px}.dog{width:280px}.stamp{right:5%;top:0}.display{font-size:clamp(57px,12vw,95px)}.hero-copy{grid-row:2}.lead{margin-top:22px}.quiz-top{margin-top:25px}.question-grid{grid-template-columns:1fr;gap:15px}.sidebar{display:none}.question{font-size:clamp(28px,7.5vw,44px)}.result-stamp{max-width:300px;margin:auto;width:100%;grid-row:1}.result .display{font-size:clamp(54px,11.5vw,98px)}.result-actions .btn{flex:1}.ticker{margin-top:28px}.gov{font-size:9px}.foot{flex-wrap:wrap}.quiz-actions .btn{min-width:170px}}@media(prefers-re /* РЕДАКТОР КОНТЕНТА: меняйте тексты, ответы (correct: 0..3) и реплики здесь. */
const QUESTIONS = [
{type:'ФАКТ ИЗ БИОГРАФИИ',q:'Кем по породе является Пижон Владиславович, если отбросить его императорские претензии?',a:['Джек-рассел-терьером','Кавказской овчаркой в командировке','Карликовым директором ЖЭКа','Бельгийской королевской сосиской'],correct:0,ok:'В документах значится джек-рассел. В душе — верховный главнокомандующий диванными войсками.',no:'Порода официально известна. Мегаломания в родословную, к сожалению, не вписывается.'},
{type:'ФАКТ ИЗ БИОГРАФИИ',q:'Когда родился этот маленький исторический катаклизм?',a:['1 января 2024 года','15 февраля 2025 года','12 июня 2026 года','В день падения Римской империи'],correct:1,ok:'15 февраля 2025 года. Человечество не заметило смены эпох, зато диван уже начал тревожиться.',no:'Историческая дата — 15 февраля 2025. Запишите, прежде чем вас лишат права подавать корм.'},
{type:'ФАКТ ИЗ БИОГРАФИИ',q:'Как звучит полное официальное имя субъекта данного расследования?',a:['Пётр Джекрасселевич','Пижон Владиславович','Сэр Гавриил Колбасов','Геннадий Пятнистый'],correct:1,ok:'Пижон Владиславович. Отчество не наследуется. Оно назначается сверху, точнее — с дивана.',no:'Пижон Владиславович. Неверно оформленные документы отправляются на обнюхивание.'},
{type:'ФАКТ ИЗ БИОГРАФИИ',q:'Что Пижон реально любит делать на прогулках, заставляя человека пересмотреть понятие свободы?',a:['Медитировать, созерцая лужайку','Тянуть поводок и оставлять метки','Двигаться исключительно рядом по уставу','Писать философские трактаты на коре берёзы'],correct:1,ok:'Тянет и метит. Для него прогулка — это передел границ и тест прочности твоего плеча.',no:'В реальной биографии фигурируют тяга поводка и метки. Стоицизм пока не зарегистрирован.'},
{type:'ФАКТ ИЗ БИОГРАФИИ',q:'Какая гастрономическая привычка Пижона заставляет хозяина сканировать тротуар, словно сапёра?',a:['Отказ от еды после 18:00','Подбирание подозрительной еды с земли','Любовь к петрушке в белом соусе','Требование меню на латыни'],correct:1,ok:'Подбирает с земли. Концепция «пищевой безопасности» для него звучит как буржуазная ересь.',no:'Главная проблема — подбирание с земли. Остальное пока не подтверждено ветеринарной разведкой.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Пижон видит холодильник. Что это, по его конституции?',a:['Холодильный агрегат класса А','Хранилище народных сосисок, незаконно захваченное человеком','Нейтральная полоса между кухней и коридором','Место, где живёт снеговик'],correct:1,ok:'Национализация холодильника объявлена. Хозяину оставлен один огурец и чувство вины.',no:'Верный ответ — народное достояние. Холодильник уже внесён в реестр стратегических сосисок.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Во время ужина хозяин не делится едой. Каков первый шаг операции «Человеческая совесть»?',a:['Уважительно отойти и заняться чтением Канта','Начать неподвижно смотреть так, будто в семье совершено военное преступление','Вызвать официанта и оплатить счёт','Попросить взаймы соль'],correct:1,ok:'Гипноз включён. Через 11 секунд хозяин начинает оправдываться перед собакой, которая не платит за квартиру.',no:'Пижоновская дипломатия начинается со взгляда, от которого даже Ницше отдал бы котлету.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Как Пижон понимает фразу «мы идём гулять»?',a:['«Сейчас я культурно пройдусь»','«Мне выделили человека-тягач и доступ к спорной территории»','«Надо проверить прогноз осадков»','«Иду на заседание ассоциации пуделей»'],correct:1,ok:'Человек в этой системе — не гражданин. Он лишь двухногая рукоятка от поводка.',no:'В политической теории Пижона поводок — средство управления персоналом.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'В 03:17 обнаружена подозрительная лужа. Как называется событие в официальном бюллетене?',a:['«Влажный государственный переворот»','«Метеорологическая аномалия Сахары»','«Реконструкция Невского проспекта»','«Фестиваль чистой плитки»'],correct:0,ok:'Переворот состоялся. Сухая прихожая капитулировала, историки пребывают в слезах.',no:'В официальном летописании это «Влажный государственный переворот». Без права на обжалование.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Хозяин пытается поспать подольше. Какая у Пижона реакция на эту антигосударственную диверсию?',a:['Самостоятельно закрыть дверь и выключить свет','Объявить внеплановое заседание у кровати с применением мокрого носа','Отправить хозяину дипломатическую ноту','Пожелать спокойных снов через SMS'],correct:1,ok:'Комиссия по пробуждению приступила к работе. Сон граждан отменён в интересах морды.',no:'Спать может лишь тот, кому выдано разрешение пижоновской канцелярии.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Во дворе появился ещё один кобель. Какова наиболее вероятная политическая риторика Пижона?',a:['«Мировой рынок допускает свободную конкуренцию»','«Кто разрешил тебе обнюхивать мою геополитическую сферу влияния?»','«Добро пожаловать, господин аудитор»','«Я не интересуюсь земельными вопросами»'],correct:1,ok:'Международный кризис начался на уровне столба. Совет безопасности обнюхивает ситуацию.',no:'Пижоновский суверенитет начинается там, где кончается чужое терпение.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Пижон услышал шуршание пакета. Каков его следующий карьерный шаг?',a:['Остаться младшим аналитиком дивана','Назначить себя главным инспектором пакетов и немедленно прибыть на место','Записаться на онлайн-курсы упаковки','Передать полномочия комнатному растению'],correct:1,ok:'Инспектор уже прибыл. Юрисдикция распространяется на кухню, спальню и пакеты случайных прохожих.',no:'Шуршание автоматически открывает вакансию главного инспектора, которую Пижон занимает без конкурса.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Если бы Пижон преподавал философию, какой тезис стал бы первым?',a:['«Я мыслю, следовательно, существую»','«Меня кормят, следовательно, мир ещё не совсем прогнил»','«Бытие определяет небытие»','«Счастье есть отсутствие любых запахов»'],correct:1,ok:'Декарт уничтожен одним мисочным силлогизмом. Истина лежит на дне кормушки.',no:'Фундамент пижоновской метафизики — не сознание, а регулярность поставок еды.'},
{type:'САТИРИЧЕСКАЯ РЕКОНСТРУКЦИЯ',q:'Что означает команда «Ко мне!» в переводе с человеческого на пижоновский?',a:['Приказ, подлежащий немедленному исполнению','Необязательное предложение, которое рассмотрят после изучения куста','Сигнал к началу шахматной партии','Просьба принести тапочки'],correct:1,ok:'Обращение зарегистрировано. Срок рассмотрения — от пяти секунд до следующей геологической эпохи.',no:'Команда носит рекомендательный характер. Решение принимает куст, а не человек.'},
{type:'ФИНАЛЬНЫЙ ГОСЭКЗАМЕН',q:'Чем на самом деле заканчивается любая попытка установить справедливый порядок в доме Пижона?',a:['Единогласно принятым семейным уставом','Торжественным признанием: квартира принадлежит Пижону, люди находятся на временной передержке','Передачей власти пылесосу','Созданием общества равных прав тапочек'],correct:1,ok:'Вы постигли высший закон пижоноведения: собственность — фикция, пока у неё есть лапы и наглая морда.',no:'Неверно. Жильцы — временные сотрудники, а квартира давно приватизирована хвостом.'}
];
const RANKS=[
{min:0,max:2,name:'ПОСТОРОННИЙ У ПОМОЙКИ ПИЖОНОВСКОЙ ИМПЕРИИ',desc:'Ты явился на собачий экзамен с уровнем подготовки ржавого ершика. Пижон потребовал проверить, не проник ли в комиссию переодетый пылесос.',symbol:'🧻'},
{min:3,max:5,name:'МЛАДШИЙ ПОДМЕТАЛЬЩИК СОБАЧЬЕГО ДВОРЦА',desc:'Некоторое знание заметно, но пока тебя допускают лишь к церемониальному выносу пакетов. Высшая мысль Пижона проходит мимо, как маршрутка в снегопад.',symbol:'🧹'},
{min:6,max:8,name:'УЧАСТКОВЫЙ ПИЖОНОВЕД НА ПОЛСТАВКИ',desc:'Ты способен отличить Пижона от табуретки и даже распознаёшь угрозу холодильнику. В придворном архиве открыли на тебя папку «условно вменяем».',symbol:'📋'},
{min:9,max:11,name:'КАНДИДАТ СОБАЧЬИХ НАУК',desc:'Диссертация на тему «Мокрый нос как инструмент государственного давления» почти защищена. Осталось убедить академсовет, что лужа — это политический жест.',symbol:'🎓'},
{min:12,max:13,name:'ПРИДВОРНЫЙ ИДЕОЛОГ ПИЖОНИЗМА',desc:'Ты читаешь геополитику каждого куста и понимаешь, почему пакет шуршит громче голоса разума. Тебе разрешено стоять рядом с миской, но не есть из неё.',symbol:'🏅'},
{min:14,max:15,name:'ВЕРХОВНЫЙ ЖРЕЦ ПИЖОНОВСКОЙ ЦИВИЛИЗАЦИИ',desc:'Твой разум пережил все пятнадцать испытаний. Пижон подписал указ: «Этого двуногого пока не выселять». Более высокой награды человечество не получало.',symbol:'👑'}
];
const STORAGE='pijonovedenie-v1';
let state={screen:'home',index:0,answers:Array(QUESTIONS.length).fill(null),name:''};
try{const prev=JSON.parse(localStorage.getItem(STORAGE));if(prev && ['home','quiz','result'].includes(prev.screen) && Array.isArray(prev.answers)&&prev.answers.length===QUESTIONS.length){state={...state,...prev};state.index=Math.max(0,Math.min(QUESTIONS.length-1,Number(state.index)||0));}}catch(e){}
const $=id=>document.getElementById(id);
const app=$('app');
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(){return state.answers.reduce((total,a,i)=>total+(a===QUESTIONS[i].correct?1:0),0)}
function dog(){return `<svg class="dog" viewBox="0 0 440 440" role="img" aria-label="Весёлый рисунок джек-рассел-терьера Пижона в короне" xmlns="http://www.w3.org/2000/svg"><g stroke="#181a16" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><path d="M170 119 150 43 195 72 215 26 248 73 296 45 278 121" fill="#ffcc50"/><circle cx="214" cy="89" r="7" fill="#e45735"/><circle cx="178" cy="91" r="6" fill="#e45735"/><circle cx="253" cy="88" r="6" fill="#e45735"/><path d="M137 154C75 90 30 152 67 245c14 36 42 55 77 45M308 156c63-67 108-5 72 89-16 38-39 47-73 46" fill="#9f6b3e"/><path d="M105 216c-4-91 50-135 114-135 88 0 129 62 126 138 4 92-45 150-122 159-77-8-127-65-118-162Z" fill="#fff9e9"/><path d="M111 180c9-65 64-99 112-96-21 42-18 76-40 107-20 26-47 44-70 40" fill="#ad7549"/><path d="M148 200c10-13 30-13 39 0" fill="none"/><path d="M260 201c10-14 32-14 42 0" fill="none"/><circle cx="168" cy="207" r="9" fill="#171a17" stroke="none"/><circle cx="282" cy="207" r="9" fill="#171a17" stroke="none"/><circle cx="171" cy="204" r="3" fill="white" stroke="none"/><circle cx="285" cy="204" r="3" fill="white" stroke="none"/><path d="M185 255q41-22 79 0-4 34-39 36-34-2-40-36Z" fill="#191917"/><path d="M224 286c-3 28-35 42-48 12m49-11c5 29 31 37 48 11" fill="none"/><path d="M196 296q27 24 58 0l-5 35q-26 29-52 0Z" fill="#eb725e"/><path d="M129 348q-29 26-31 69h246q-3-46-40-74" fill="#fff9e9"/><path d="M143 352q81 51 159-2" fill="none" stroke="#e45735" stroke-width="20"/><circle cx="224" cy="381" r="16" fill="#ffce51"/><path d="M217 380h14m-7-7v14" stroke-width="3"/></g></svg>`}
function renderHome(){app.innerHTML=`<section class="stage hero-layout"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span>Единый государственный экзамен · Особый режим</div><h1 class="display">ПИЖОНО<span>ВЕДЕНИЕ.</span></h1><p class="lead">Насколько хорошо ты знаешь Пижона Владиславовича? Пятнадцать вопросов, четыре варианта и один пёс, которому давно пора выдать собственное министерство.</p><div class="info-pills"><span class="pill">15 вопросов</span><span class="pill">~ 4 минуты</span><span class="pill">Сомнительная честь</span></div><div class="input-wrap"><label for="name">Имя кандидата (необязательно)</label><input id="name" placeholder="Например, граф Сосискин" maxlength="30" value="${h(state.name)}"></div><button class="btn" id="start">НАЧАТЬ ГОСЭКЗАМЕН <span aria-hidden="true">↗</span></button><p class="fineprint">Первые вопросы — настоящие факты о Пижоне. Остальное — художественные постановления его воображаемого министерства. Никакой регистрации, рекламы и отправки ответов на сервер.</p></div><div class="hero-art"><div class="sun"></div>${dog()}<div class="stamp">ОДОБРЕНО<br>ХВОСТОМ<br>№ 001</div></div></section><div class="ticker">✦ Гражданин, сохраняйте достоинство · Оно вам больше не понадобится · Пижон следит за вашим выбором ✦</div>`;$('name').addEventListener('input',e=>{state.name=e.target.value;save()});$('start').onclick=()=>{state.screen='quiz';state.index=0;save();render();};}
function renderQuiz(){const q=QUESTIONS[state.index],ans=state.answers[state.index],answered=ans!==null;const done=state.answers.filter(x=>x!==null).length;app.innerHTML=`<section class="stage"><div class="quiz-top"><div><div class="subtle">Аттестационное дело № 001 · ${h(state.name||'анонимный двуногий')}</div><div class="counter">${String(state.index+1).padStart(2,'0')} <small>/ ${QUESTIONS.length}</small></div></div><div class="subtle">В деле: ${done} / ${QUESTIONS.length}</div></div><div class="progress" role="progressbar" aria-valuenow="${state.index+1}" aria-valuemin="1" aria-valuemax="${QUESTIONS.length}"><div class="progress-bar" style="width:${100*(state.index+1)/QUESTIONS.length}%"></div></div><div class="question-grid"><div class="question-card"><div class="question-type">${h(q.type)} · Вопрос ${state.index+1}</div><h2 class="question">${h(q.q)}</h2><div class="choices">${q.a.map((label,i)=>{let cl='choice';if(answered){if(i===q.correct)cl+=' correct';else if(i===ans)cl+=' wrong';else cl+=' dim';}return `<button class="${cl}" type="button" data-choice="${i}" ${answered?'disabled':''}><b>${'АБВГ'[i]}</b><span>${h(label)}</span></button>`}).join('')}</div>${answered?`<div class="response ${ans===q.correct?'':'nope'}" role="status"><h3>${ans===q.correct?'✓ Комиссия одобряет':'✗ Позор в личное дело'}</h3><p>${h(ans===q.correct?q.ok:q.no)}</p></div>`:''}<div class="quiz-actions"><button class="back" id="back">← ${state.index===0?'На главную':'Предыдущий вопрос'}</button><button class="btn dark" id="next" ${!answered?'disabled':''}>${state.index===QUESTIONS.length-1?'ВЫНЕСТИ ПРИГОВОР':'СЛЕДУЮЩИЙ ВОПРОС'} ↗</button></div></div><aside class="sidebar"><div class="subtle">Внутренний протокол</div><div class="side-big">${String(score()).padStart(2,'0')}</div><div class="side-caption">Заслуженных баллов. Пижон сохраняет право на пересмотр.</div><div class="side-badge">«Экзаменуемый признаётся условно разумным до вынесения результата»</div></aside></div></section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.choice);state.answers[state.index]=i;save();render();});$('back').onclick=()=>{if(state.index===0){state.screen='home'}else{state.index--}save();render()};$('next').onclick=()=>{if(state.answers[state.index]===null)return;if(state.index===QUESTIONS.length-1){state.screen='result'}else{state.index++}save();render();if(state.screen==='result')celebrate()};}
function renderResult(){const s=score(),rank=RANKS.find(r=>s>=r.min&&s<=r.max)||RANKS[0];app.innerHTML=`<section class="stage result"><div class="eyebrow"><span class="dot"></span>Секретный указ опубликован</div><div class="result-hero"><div><h1 class="display">ВЕРДИКТ<span>ВЫНЕСЕН.</span></h1><div class="subtle">${h(state.name||'Уважаемый безымянный субъект')}, ваше дело рассмотрено</div><div class="score-line">${s}<span> / ${QUESTIONS.length}</span></div><div class="rank">${h(rank.name)}</div><p class="rank-info">${h(rank.desc)}</p><div class="result-actions"><button class="btn" id="share">ПОДЕЛИТЬСЯ ПОЗОРОМ ↗</button><button class="btn cream" id="restart">ПРОЙТИ СНОВА ↻</button></div></div><div class="result-stamp"><div class="medal">${rank.symbol}</div><p>Министерство Пижона<br>удостоверяет результат</p><div style="font:900 44px Impact,Arial,sans-serif">${s} / ${QUESTIONS.length}</div><p>Печать поставлена мокрым носом</p></div></div><div class="breakdown"><h3>РАССЕКРЕЧЕННЫЙ ПРОТОКОЛ</h3>${QUESTIONS.map((q,i)=>`<div class="break-item"><span class="symbol">${state.answers[i]===q.correct?'✓':'✗'}</span><span>${h(q.q)}</span></div>`).join('')}</div></section>`;$('restart').onclick=()=>{state={screen:'home',index:0,answers:Array(QUESTIONS.length).fill(null),name:state.name};save();render()};$('share').onclick=()=>shareResult(s,rank)}
async function shareResult(s,rank){const text=`Я прошёл государственный экзамен по пижоноведению: ${s}/${QUESTIONS.length}. Мой титул: «${rank.name}». А ты выдержишь встречу с Пижоном Владиславовичем?`;const url=location.protocol==='http:'||location.protocol==='https:'?location.href.split('#')[0]:'';try{if(navigator.share&&url){await navigator.share({title:'Пижоноведение',text,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+(url?'\n'+url:''));toast('Результат скопирован. Пижон доволен.')}catch(e){const box=document.createElement('textarea');box.value=text+(url?'\n'+url:'');document.body.appendChild(box);box.select();try{document.execCommand('copy');toast('Результат скопирован.')}catch(e){toast('Скопируйте результат вручную.')}box.remove()}}
function toast(text){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),2900)}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='confetti';for(let i=0;i<48;i++){const bit=document.createElement('i');bit.style.cssText=`left:${Math.random()*100}%;--dur:${3+Math.random()*2}s;--angle:${Math.random()*360}deg;--drift:${(Math.random()-.5)*280}px;--color:${['#e45735','#c7e993','#ffcf4c','#171a17'][i%4]};animation-delay:${Math.random()*.8}s`;c.append(bit)}document.body.append(c);setTimeout(()=>c.remove(),6000)}
function render(){if(state.screen==='quiz')renderQuiz();else if(state.screen==='result'&&state.answers.every(a=>a!==null))renderResult();else renderHome();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('keydown',e=>{if(state.screen!=='quiz'||state.answers[state.index]!==null||e.altKey||e.metaKey||e.ctrlKey||e.target.tagName==='INPUT')return;const n=Number(e.key);if(n>=1&&n<=4){document.querySelector(`[data-choice="${n-1}"]`)?.click()}});
render();
</script>
</body></html>
